<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wedding After Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --paper: #fbf9f5;
    --ink: #3a3631;
    --sub: #8a8178;
    --line: #e7e1d8;
    --accent: #b49a6a;
    --hit: #f6efe1;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 17px; line-height: 1.8; letter-spacing: .03em;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }
  .en { font-family: "Cormorant Garamond", serif; letter-spacing: .12em; }

  header { text-align: center; padding: 72px 20px 56px; border-bottom: 1px solid var(--line); }
  header .lead { color: var(--accent); font-size: 15px; font-style: italic; margin: 0; }
  header h1 { font-weight: 400; font-size: 34px; margin: 6px 0 18px; line-height: 1.3; }
  header .couple { font-size: 20px; margin: 0; }
  header .date { color: var(--sub); font-size: 15px; margin: 8px 0 0; }
  .orn { display: block; width: 48px; height: 1px; background: var(--accent); margin: 22px auto; border: 0; }

  nav { position: sticky; top: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line); z-index: 5; }
  nav ul { list-style: none; margin: 0 auto; padding: 0 8px; display: flex; justify-content: center;
           gap: 4px; max-width: 560px; overflow-x: auto; }
  nav a { display: block; padding: 12px 10px; color: var(--sub); text-decoration: none; font-size: 14px; white-space: nowrap; }
  nav a:hover { color: var(--ink); }

  section { padding: 56px 0 8px; scroll-margin-top: 48px; }
  h2 { text-align: center; font-weight: 400; margin: 0 0 28px; line-height: 1.4; }
  h2 .en { display: block; font-size: 26px; color: var(--ink); }
  h2 .ja { display: block; font-size: 13px; color: var(--sub); letter-spacing: .2em; }

  dl.info { margin: 0; border-top: 1px solid var(--line); }
  dl.info div { display: flex; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  dl.info dt { width: 5.5em; flex: none; color: var(--sub); font-size: 15px; }
  dl.info dd { margin: 0; }
  dl.info a { color: var(--accent); }

  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .photos figure { margin: 0; }
  .photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; display: block; }
  .photos figcaption { text-align: center; color: var(--sub); font-size: 13px; margin-top: 4px; }

  ol.timeline { list-style: none; margin: 0; padding: 0 0 0 8px; }
  ol.timeline li { position: relative; display: flex; gap: 20px; padding: 0 0 26px 22px; border-left: 1px solid var(--line); }
  ol.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  ol.timeline li::before { content: ""; position: absolute; left: -5px; top: 9px; width: 9px; height: 9px;
                           border-radius: 50%; background: #fff; border: 1px solid var(--accent); }
  ol.timeline .t { font-family: "Cormorant Garamond", serif; font-size: 20px; width: 3.8em; flex: none; line-height: 1.5; }

  .search { position: relative; }
  .search input { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border: 1px solid var(--line);
                  border-radius: 999px; background: var(--paper); color: var(--ink); outline: none; }
  .search input:focus { border-color: var(--accent); }
  .hint { color: var(--sub); font-size: 13px; text-align: center; margin: 10px 0 0; }
  .results { margin-top: 18px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px;
          display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .card .name { font-size: 19px; }
  .card .grp { color: var(--sub); font-size: 13px; }
  .card .tbl { text-align: center; }
  .card .tbl small { display: block; color: var(--sub); font-size: 11px; letter-spacing: .15em; }
  .card .tbl b { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 30px; line-height: 1.1; }
  .empty { text-align: center; color: var(--sub); font-size: 15px; }

  .tables { display: grid; gap: 16px; }
  .table-box { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .table-box h3 { margin: 0; padding: 12px 18px; background: var(--paper); font-weight: 400; font-size: 15px;
                  display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
  .table-box h3 .en { font-size: 22px; }
  .table-box h3 small { color: var(--sub); font-size: 13px; }
  .table-box ul { list-style: none; margin: 0; padding: 6px 18px 10px; }
  .table-box li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .table-box li:last-child { border-bottom: 0; }
  .table-box li .grp { color: var(--sub); font-size: 13px; }
  .table-box li.hit { background: var(--hit); margin: 0 -18px; padding: 8px 18px; }
  .note { color: var(--sub); font-size: 13px; text-align: center; margin: 14px 0 0; }

  .map { text-align: center; }
  .map img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
  .map .placeholder { border: 1px dashed var(--line); border-radius: 12px; padding: 36px 16px; color: var(--sub); font-size: 15px; }

  ul.news { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.news li { padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
  ul.news time { display: block; color: var(--sub); font-size: 13px; font-family: "Cormorant Garamond", serif; letter-spacing: .1em; }

  footer { text-align: center; padding: 64px 20px 48px; color: var(--sub); font-size: 13px; }
  footer .en { font-size: 18px; color: var(--ink); display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <p class="lead en">Thank you for celebrating with us</p>
  <h1 class="en" id="title"></h1>
  <p class="couple" id="couple"></p>
  <hr class="orn">
  <p class="date" id="hdate"></p>
</header>

<nav><ul>
  <li><a href="#info">ご案内</a></li>
  <li><a href="#schedule">当日の流れ</a></li>
  <li><a href="#seat">お席</a></li>
  <li><a href="#map">会場図</a></li>
  <li><a href="#news">お知らせ</a></li>
</ul></nav>

<main class="wrap">
  <section id="info">
    <h2><span class="en">Information</span><span class="ja">ご案内</span></h2>
    <dl class="info" id="infoList"></dl>
    <div class="photos" id="photos"></div>
  </section>

  <section id="schedule">
    <h2><span class="en">Schedule</span><span class="ja">当日の流れ</span></h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section id="seat">
    <h2><span class="en">Your Seat</span><span class="ja">お席のご案内</span></h2>
    <div class="search">
      <input id="q" type="search" placeholder="お名前を入力（例：高橋）" autocomplete="off" aria-label="お名前で検索">
    </div>
    <p class="hint">姓・名のどちらかだけでも検索できます</p>
    <div class="results" id="results"></div>

    <div class="tables" id="tables" style="margin-top:32px"></div>
    <p class="note" id="tableNote"></p>
  </section>

  <section id="map">
    <h2><span class="en">Floor Map</span><span class="ja">会場図</span></h2>
    <div class="map" id="mapBox"></div>
  </section>

  <section id="news">
    <h2><span class="en">News</span><span class="ja">お知らせ</span></h2>
    <ul class="news" id="newsList"></ul>
  </section>
</main>

<footer>
  <span class="en" id="fcouple"></span>
  最終更新 <span id="updated"></span>
</footer>

<script src="data.js"></script>
<script>
(function () {
  var S = window.SITE;
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  // 「A or D」のような未確定の席を読みやすくする
  function tableLabel(t) { return String(t).replace(/\s*or\s*/i, " / "); }
  function undecided(t) { return /or/i.test(t); }

  $("title").textContent = S.title;
  $("couple").textContent = S.couple;
  $("fcouple").textContent = S.couple;
  $("hdate").textContent = S.info.date;
  $("updated").textContent = S.updated;

  // ご案内（空欄は出さない）
  var labels = [["date", "日時"], ["reception", "受付"], ["venue", "会場"], ["address", "住所"],
                ["fee", "会費"], ["dress", "服装"], ["contact", "お問い合わせ"]];
  var html = "";
  labels.forEach(function (l) {
    var v = S.info[l[0]];
    if (!v) return;
    var body = esc(v).replace(/\n/g, "<br>");
    if (l[0] === "address" && S.info.mapUrl) {
      body += '<br><a href="' + esc(S.info.mapUrl) + '" target="_blank" rel="noopener">地図を開く</a>';
    }
    if (l[0] === "address" && S.info.addressNote) {
      body += '<br><span style="color:var(--sub);font-size:14px">' + esc(S.info.addressNote) + "</span>";
    }
    html += "<div><dt>" + l[1] + "</dt><dd>" + body + "</dd></div>";
  });
  $("infoList").innerHTML = html;
  $("photos").innerHTML = (S.photos || []).map(function (p) {
    return '<figure><img src="' + esc(p.src) + '" alt="' + esc(p.caption) + '" loading="lazy"><figcaption>' +
           esc(p.caption) + "</figcaption></figure>";
  }).join("");

  // 当日の流れ
  $("timeline").innerHTML = S.schedule.map(function (s) {
    return '<li><span class="t">' + esc(s.time) + "</span><span>" + esc(s.text) + "</span></li>";
  }).join("");

  // テーブル別の名簿
  var guests = S.guests.map(function (g, i) {
    return { id: i, sei: g[0], mei: g[1], group: g[2], table: g[3], full: g[0] + " " + g[1] };
  });
  var order = [];
  var byTable = {};
  guests.forEach(function (g) {
    if (!byTable[g.table]) { byTable[g.table] = []; order.push(g.table); }
    byTable[g.table].push(g);
  });
  order.sort();
  function renderTables(hits) {
    $("tables").innerHTML = order.map(function (t) {
      var list = byTable[t].map(function (g) {
        var cls = hits && hits[g.id] ? ' class="hit"' : "";
        return "<li" + cls + "><span>" + esc(g.full) + '</span><span class="grp">' + esc(g.group) + "</span></li>";
      }).join("");
      return '<div class="table-box"><h3><span>Table <span class="en">' + esc(tableLabel(t)) +
             "</span></span><small>" + byTable[t].length + "名</small></h3><ul>" + list + "</ul></div>";
    }).join("");
  }
  renderTables(null);
  if (order.some(undecided)) {
    $("tableNote").textContent = "「A / D」の方は、いずれかのテーブルに自由にご着席ください";
  }

  // 名前検索（スペースの有無は問わない）
  function norm(s) { return String(s).replace(/[\s　]/g, "").toLowerCase(); }
  $("q").addEventListener("input", function () {
    var q = norm(this.value);
    if (!q) { $("results").innerHTML = ""; renderTables(null); return; }
    var found = guests.filter(function (g) { return norm(g.sei + g.mei).indexOf(q) !== -1; });
    var hits = {};
    found.forEach(function (g) { hits[g.id] = true; });
    renderTables(hits);
    if (!found.length) {
      $("results").innerHTML = '<p class="empty">見つかりませんでした。お手数ですが受付でお尋ねください。</p>';
      return;
    }
    $("results").innerHTML = found.map(function (g) {
      return '<div class="card"><div><div class="name">' + esc(g.full) + ' 様</div><div class="grp">' + esc(g.group) +
             '</div></div><div class="tbl"><small>TABLE</small><b>' + esc(tableLabel(g.table)) + "</b></div></div>";
    }).join("");
  });

  // 会場図
  $("mapBox").innerHTML = S.floorMap
    ? '<a href="' + esc(S.floorMap) + '" target="_blank" rel="noopener"><img src="' + esc(S.floorMap) +
      '" alt="会場図"></a><p class="note">タップすると拡大できます</p>'
    : '<div class="placeholder">会場図は後日掲載します</div>';

  // お知らせ
  $("newsList").innerHTML = S.news.map(function (n) {
    return "<li><time>" + esc(n.date) + "</time>" + esc(n.text) + "</li>";
  }).join("");
})();
</script>
</body>
</html>
